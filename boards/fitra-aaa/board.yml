board:
  name: fitra-aaa
  full_name: FITRA-AAA
  vendor: hitohira
  socs:
    - name: nrf54l15
      variants:
        - name: xip
          cpucluster: cpuflpr
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - fitra-aaa/nrf54l15/cpuapp
              - fitra-aaa/nrf54l15/cpuflpr
              - fitra-aaa/nrf54l15/cpuflpr/xip
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - fitra-aaa/nrf54l15/cpuapp
              - fitra-aaa/nrf54l15/cpuflpr
              - fitra-aaa/nrf54l15/cpuflpr/xip
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - fitra-aaa/nrf54l15/cpuapp
              - fitra-aaa/nrf54l15/cpuflpr
              - fitra-aaa/nrf54l15/cpuflpr/xip
