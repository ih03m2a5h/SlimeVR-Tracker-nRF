# AN54LQ-15 (nRF54L15 module) config for SlimeVR-Tracker-nRF

# UART console for logging
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y

# Required for timing on nRF54L series
CONFIG_NRF_GRTC_START_SYSCOUNTER=y

# Battery voltage mapping: VDD ≈ battery voltage (VBAT→VDD direct, internal DCDC)
CONFIG_BATTERY_USE_REG_BUCK_MAPPING=y

# nRF54L15 starts up with HW stack protection enabled; too-small stacks
# can overflow immediately (UsageFault STKOF -> forced HardFault).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=8192
