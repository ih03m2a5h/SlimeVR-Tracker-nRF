# XIAO nRF54L15 (cpuapp) application config overrides

# USB はハードウェア的に未統合のため、グローバルの設定を上書きして無効化
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_HID=n
CONFIG_USB_CDC_ACM=n

# UART console for logging (UART20 is the default serial port)
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y

# Enable detailed logging for debugging
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SENSOR_LOG_LEVEL_DBG=y
# Disable SPI driver debug logs to reduce log buffer usage
CONFIG_SPI_LOG_LEVEL_INF=y
# Increase log buffer size to prevent message drops
CONFIG_LOG_BUFFER_SIZE=4096

# Required for timing on nRF54L series
CONFIG_NRF_GRTC_START_SYSCOUNTER=y

# XIAO specific features
CONFIG_BATTERY_USE_REG_LDO_MAPPING=y
CONFIG_LED_RGB_COLOR=y

# nRF54L15 starts up with HW stack protection enabled; too-small stacks
# can overflow immediately (UsageFault STKOF -> forced HardFault).
CONFIG_MAIN_STACK_SIZE=4096

# Interrupt/exception stack (MSP). The default (1024) is too small here and
# we hit STKOF very early during exception handling.
CONFIG_ISR_STACK_SIZE=8192